<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hidden Nature Window</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { margin:0; background:#0f1410; color:#eef4ef; }
    main { max-width:980px; margin:auto; padding:32px 18px 64px; }
    h1 { margin-bottom:6px; }
    .sub { opacity:.72; margin-top:0; }
    .panel { background:#182019; border:1px solid #344136; border-radius:18px; padding:18px; margin-top:18px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:block; font-size:13px; opacity:.8; margin-bottom:6px; }
    select,input,textarea,button { box-sizing:border-box; width:100%; border-radius:10px; border:1px solid #465148; padding:11px; font:inherit; }
    textarea { min-height:340px; resize:vertical; line-height:1.55; }
    button { cursor:pointer; font-weight:700; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .small { font-size:12px; opacity:.65; }
    @media (max-width:720px){ .grid,.actions { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Hidden Nature Window</h1>
  <p class="sub">进入 → 包围 → 引导 → 显露</p>

  <section class="panel">
    <div class="grid">
      <div>
        <label for="scene">场景 / Scene</label>
        <select id="scene"></select>
      </div>
      <div>
        <label for="language">语言 / Language</label>
        <select id="language">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="bilingual">中英双语</option>
        </select>
      </div>
      <div>
        <label for="visualStyle">视觉表现 / Visual Impact</label>
        <select id="visualStyle">
          <option value="natural">自然克制 / Natural restraint</option>
          <option value="contrast">反差增强 / Strong contrast</option>
          <option value="impact" selected>视觉冲击 / High visual impact</option>
        </select>
      </div>
      <div>
        <label for="emotion">情绪覆盖（可选）</label>
        <input id="emotion" placeholder="例如：思念 / quiet curiosity">
      </div>
      <div>
        <label for="hook">视觉钩子覆盖（可选）</label>
        <input id="hook" placeholder="例如：唯一一朵红花">
      </div>
      <div>
        <label for="window">隐藏窗口覆盖（可选）</label>
        <input id="window" placeholder="例如：枝叶之间的一小块蓝天">
      </div>
    </div>

    <div class="actions">
      <button id="generate">生成提示词</button>
      <button id="oneClick">一键随机生成</button>
    </div>
  </section>

  <section class="panel">
    <h3>动态场景组合 / Scene Composer</h3>
    <div class="grid">
      <div><label>植物</label><select id="plant">
        <option value="grass">草丛</option><option value="bamboo">竹</option><option value="lotus">荷</option>
        <option value="reeds">芦苇</option><option value="maple">枫</option><option value="snow_branches">雪枝</option><option value="fern">蕨</option>
      </select></div>
      <div><label>地点</label><select id="location">
        <option value="field">田野</option><option value="forest">森林</option><option value="pond">池塘</option>
        <option value="mountain">山地</option><option value="wetland">湿地</option><option value="garden">庭园</option><option value="coast">海岸</option>
      </select></div>
      <div><label>情绪</label><select id="composerEmotion">
        <option value="calm">安静</option><option value="longing">思念</option><option value="mystery">神秘</option>
        <option value="freedom">自由</option><option value="renewal">新生</option><option value="solitude">孤独</option>
      </select></div>
    </div>
    <div class="actions">
      <button id="compose">组合新场景并生成</button>
      <button id="composeSeries">组合系列（6条）</button>
    </div>
  </section>

  <section class="panel">
    <label for="output">Prompt</label>
    <textarea id="output" readonly></textarea>
    <div class="actions">
      <button id="copy">复制</button>
      <button id="clear">清空</button>
    </div>
    <p id="meta" class="small"></p>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
